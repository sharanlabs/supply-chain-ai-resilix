name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App Quality Gate
    runs-on: ubuntu-latest
    # Pinned to the installed Playwright version (package-lock: 1.59.1). The image
    # ships Chromium + OS deps pre-baked, so e2e needs NO browser download — the
    # runner's egress to Playwright's browser CDN is blocked, which hung the old
    # `playwright install` step until the job timed out. Bump this tag in lockstep
    # with the @playwright/test version.
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # B-09 (2026-07-16 re-review): run the SAME gate the repo runs locally, not a
      # hand-maintained subset. `npm run verify` = typecheck · lint · contrast-check ·
      # unit/eval tests · customs:golden · production build · secret scan. The earlier
      # per-step list silently dropped contrast-check.mjs and customs:golden, so CI could
      # go green while the local gate was red — calling the script makes drift impossible.
      - name: Verify (typecheck · lint · contrast · tests · customs:golden · build · secrets)
        run: npm run verify

      - name: Dependency audit
        run: npm audit --audit-level=high

      # No "playwright install" step: Chromium is pre-baked into the container image.
      - name: Playwright e2e + accessibility (axe / keyboard / WCAG 2.2)
        run: npm run test:e2e

      # B-10 (2026-07-16 re-review): the PROD CSP is nonce-based and strips 'unsafe-eval',
      # so it differs from the dev CSP the e2e exercises — a nonce/strict-dynamic regression
      # passes verify:full and still white-screens prod. This drives a real browser against a
      # real `next start` (the build from `npm run verify` above) and asserts the policy is
      # strict AND the page hydrates under it. Same-container, post-build, so no rebuild.
      - name: Production CSP smoke (real next start + browser)
        run: |
          npx next start -p 3011 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3011/ >/dev/null 2>&1 && break
            sleep 1
          done
          SMOKE_URL=http://127.0.0.1:3011 npm run smoke:csp
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

  postgres:
    name: Postgres integrity proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: app
    # B-11 (2026-07-16 re-review): an EPHEMERAL Postgres service, so the DB integration
    # suite ALWAYS runs on every PR — it no longer depends on an owner-configured
    # DATABASE_URL secret (which silently SKIPPED the whole proof when unset: a false green).
    # This is the only place the B-14 ON DELETE RESTRICT/CASCADE behavior is exercised
    # against a real engine (evals/db-referential-integrity.test.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resilix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resilix_test
      ENABLE_LIVE_AI: "false"
      RUN_DB_INTEGRATION_TESTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # drizzle-kit push applies schema.ts (incl. the B-14 restrict FKs) directly.
      - name: Push schema
        run: npm run db:push

      - name: DB integration proof (persistence · concurrency · execution · B-14 referential integrity)
        run: npm run test:db
