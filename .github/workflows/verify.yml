name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and eval tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Secret scan
        run: npm run secrets:scan

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install Playwright browser
        timeout-minutes: 12
        run: |
          # Per-attempt timeout: the download can HANG (not just fail), so each
          # attempt is killed after 180s and retried, rather than blocking the job.
          for attempt in 1 2 3; do
            echo "::group::Playwright install (attempt $attempt/3)"
            if timeout 180 npx playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Playwright browser install failed/timed out on attempt $attempt; retrying in 15s..." >&2
            sleep 15
          done
          echo "Playwright browser install failed after 3 attempts" >&2
          exit 1

      - name: Playwright e2e + accessibility (axe / keyboard / WCAG 2.2)
        run: npm run test:e2e

  postgres:
    name: Optional Postgres/Neon Proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENABLE_LIVE_AI: "false"
      RUN_DB_INTEGRATION_TESTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Skip DB proof when secret is absent
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret is not configured; skipping Postgres/Neon proof."

      - name: Push schema
        if: env.DATABASE_URL != ''
        run: npm run db:push

      - name: Run DB integration proof
        if: env.DATABASE_URL != ''
        run: npm run test:db
